[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/dj-libraries",
    "crates/cli",
    "gui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DJ Dedupe Team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
walkdir = "2.5"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
log = "0.4"
lofty = "0.21"
rusqlite = { version = "0.33", features = ["bundled"] }
quick-xml = { version = "0.37", features = ["serialize"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
trash = "5.3"
libc = "0.2"
