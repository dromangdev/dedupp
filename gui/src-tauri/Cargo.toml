[package]
name = "dedupp-gui"
version = "0.3.0"
description = "Dedupp Desktop GUI"
authors = ["Dedupp Team"]
license = "MIT"
repository = "https://github.com/dromangdev/dedupp"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
rfd = "0.18"
dedupp-core = { path = "../../crates/core" }
dj-libraries = { path = "../../crates/dj-libraries" }
libc = { workspace = true }
