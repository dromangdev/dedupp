name: CI & Build Multiplatform (macOS, Windows, Linux)

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Target GitHub Release tag to attach installers'
        required: false
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Run Cargo Tests
        run: cargo test --workspace

  build-desktop:
    name: Build Desktop Bundle (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Tauri Desktop App
        run: |
          cd gui
          npx -y @tauri-apps/cli build

      - name: Build CLI Binary
        run: |
          cargo build --release -p dedupp-cli

      - name: Package CLI (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          mkdir -p target/release/cli-dist
          tar -czvf target/release/cli-dist/dedupp_0.3.0_linux_amd64.tar.gz -C target/release dedupp

      - name: Package CLI (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          mkdir -p target/release/cli-dist
          tar -czvf target/release/cli-dist/dedupp_0.3.0_macos_aarch64.tar.gz -C target/release dedupp

      - name: Package CLI (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          mkdir -p target/release/cli-dist
          tar -czvf target/release/cli-dist/dedupp_0.3.0_windows_x64.tar.gz -C target/release dedupp.exe

      - name: Upload Artifacts (macOS DMG & CLI)
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: Dedupp-macOS-dmg
          if-no-files-found: warn
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/cli-dist/*.tar.gz

      - name: Upload Artifacts (Windows Installers & CLI)
        if: startsWith(matrix.os, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: Dedupp-Windows-installer
          if-no-files-found: warn
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/cli-dist/*.tar.gz

      - name: Upload Artifacts (Linux Packages & CLI)
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: Dedupp-Linux-packages
          if-no-files-found: warn
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/AppImage/*.AppImage
            target/release/cli-dist/*.tar.gz

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v0.3.0' }}
          files: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/AppImage/*.AppImage
            target/release/cli-dist/*.tar.gz
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
